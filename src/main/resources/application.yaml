spring:
  application:
    name: servico-usuarios
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/sgp
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Garante o schema do serviço antes do Liquibase e do Hibernate usarem a conexão.
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ${spring.liquibase.default-schema}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${spring.liquibase.default-schema}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: usuarios
    # As tabelas de controle do Liquibase ficam no public, pois o schema do serviço
    # ainda não existe quando o Liquibase inicia.
    liquibase-schema: public
    parameters:
      schema: ${spring.liquibase.default-schema}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/sgp}

server:
  port: 8081
  servlet:
    context-path: /api
